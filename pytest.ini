[pytest]
# Директория с тестами
testpaths = tests

# Паттерн для поиска тестовых файлов
python_files = test_*.py

# Паттерн для тестовых классов
python_classes = Test*

# Паттерн для тестовых функций
python_functions = test_*

# Маркеры
markers =
    smoke: быстрые smoke тесты
    regression: регрессионные тесты

# Опции по умолчанию
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Настройки Allure
allure_title = Stellar Burgers Autotests
allure_description = Автоматизированные тесты для веб-приложения Stellar Burgers